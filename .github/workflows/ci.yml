name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately. The manifest declares nextflowVersion '>=23.04.0';
  # 25.x enables the strict syntax parser by default, which is a different
  # language surface from the one this pipeline was written against.
  NXF_VER: "24.10.5"
  NXF_ANSI_LOG: false

# This repository ships no data. The reads are unpublished and the reference is
# large, so CI checks what can be checked without them: that the DSL2 graph
# parses, that every profile resolves, and that the embedded Python in each
# module is syntactically valid.

jobs:
  parse:
    name: DSL2 parses and profiles resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}
      - run: nextflow -version

      # --outdir is passed even though --help returns before using it: the
      # timeline/report/trace paths interpolate params.outdir at config time,
      # and a null there writes provenance into a directory named "null".
      - name: Help text renders
        run: nextflow run . --help --outdir ./ci_outdir

      # One step per profile so a failure names the profile, and NOTHING is
      # redirected: `nextflow config` reports resolution errors on stdout, so
      # sending stdout to /dev/null turns a diagnosable failure into a bare
      # exit code.
      - name: Profile - docker
        run: nextflow config . -profile docker
      - name: Profile - singularity
        run: nextflow config . -profile singularity
      - name: Profile - conda
        run: nextflow config . -profile conda
      - name: Profile - sge
        run: nextflow config . -profile sge

      - name: Upload the Nextflow log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-log
          path: .nextflow.log
          if-no-files-found: ignore

  module_scripts:
    name: Embedded module scripts are valid Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile every python process body
        run: |
          python3 - <<'PYEOF'
          import ast, pathlib, re, sys, textwrap
          failed = []
          for f in sorted(pathlib.Path("modules/local").glob("*.nf")):
              body = re.search(r'script:\s*"""(.*?)"""', f.read_text(), re.S)
              if not body or "#!/usr/bin/env python" not in body.group(1):
                  continue
              src = body.group(1)
              src = src.replace('\\\\n', '\\n').replace('\\\\r', '\\r')
              src = src.replace('\\"', '"').replace('\\$', '$').replace('\\\\', '\\')
              src = re.sub(r'\$\{[^}]*\}', 'X', src)
              src = textwrap.dedent(src)
              src = "\n".join(l for l in src.splitlines() if not l.strip().startswith("#!"))
              try:
                  ast.parse(src); print(f"ok    {f.name}")
              except SyntaxError as e:
                  failed.append(f.name); print(f"FAIL  {f.name}:{e.lineno}: {e.msg}")
          sys.exit(1 if failed else 0)
          PYEOF
